<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 560" width="1016" height="560" role="img" aria-label="XT Envelopes widget preview">
  <!-- Electra One MK2 display (1016×560), XT envelopes by Thomas Moravansky -->

  <!-- background -->
  <rect x="0" y="0" width="1016" height="560" fill="#000000"/>

  <!-- ====== Custom tile: envelope canvas ======
       WAVE mode 8-point envelope, Lua colors:
       STD_COLOR 0xB0C0 ~ pale gold #B0B0C0
       ACT_COLOR 0xFF0000 red (active point)
       ON_COLOR  0x0000FF blue (key-on loop)
       OFF_COLOR 0x00FF00 green (key-off loop)
       WIN_OFST 70, SCALEX 0.90625, SCALEY 2 -->
  <g transform="translate(12, 20)">
    <rect x="0" y="70" width="992" height="256" fill="none" stroke="#B0B0C0" stroke-width="1"/>

    <!-- loop indicator strip above canvas -->
    <rect x="0"   y="35" width="232" height="10" fill="#0000FF" opacity="0.9"/>
    <rect x="343" y="50" width="10"  height="10" fill="#00FF00" opacity="0.9"/>

    <polyline points="0,326 116,286 232,286 348,286 464,286 528,286 644,286 760,286 876,286 992,326"
              fill="none" stroke="#B0B0C0" stroke-width="1.2"/>

    <!-- sustain segment emphasis -->
    <line x1="464" y1="286" x2="528" y2="286" stroke="#B0B0C0" stroke-width="2" stroke-dasharray="4,3"/>

    <circle cx="116" cy="286" r="9" fill="#FF0000"/>
    <circle cx="232" cy="286" r="9" fill="#B0B0C0"/>
    <circle cx="348" cy="286" r="9" fill="#B0B0C0"/>
    <circle cx="464" cy="286" r="9" fill="#B0B0C0"/>
    <circle cx="644" cy="286" r="9" fill="#B0B0C0"/>
    <circle cx="760" cy="286" r="9" fill="#B0B0C0"/>
    <circle cx="876" cy="286" r="9" fill="#B0B0C0"/>
    <circle cx="992" cy="326" r="9" fill="#B0B0C0"/>

    <g font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-size="9" fill="#FF0000">
      <text x="110" y="12">T1: 127</text>
      <text x="110" y="23">L1:  20</text>
    </g>
    <g font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-size="9" fill="#B0B0C0">
      <text x="220" y="12">T2: 127</text><text x="220" y="23">L2: 20</text>
      <text x="330" y="12">T3: 127</text><text x="330" y="23">L3: 20</text>
      <text x="440" y="12">T4: 127</text><text x="440" y="23">L4: 20</text>
      <text x="640" y="12">T5: 127</text><text x="640" y="23">L5: 20</text>
      <text x="750" y="12">T6: 127</text><text x="750" y="23">L6: 20</text>
      <text x="860" y="12">T7: 127</text><text x="860" y="23">L7: 20</text>
      <text x="965" y="12">T8: 127</text><text x="965" y="23">L8: 127</text>
    </g>
  </g>

  <!-- ====== Surrounding tiles (pads + faders + labels) ====== -->
  <g font-family="'Open Sans','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="600" fill="#ffffff">

    <rect x="12" y="380" width="110" height="50" rx="6" fill="none" stroke="#444" stroke-width="1"/>
    <text x="67" y="410" text-anchor="middle" fill="#888">KEY ON LOOP</text>

    <rect x="128" y="380" width="110" height="50" rx="4" fill="none" stroke="#444"/>
    <line x1="138" y1="417" x2="228" y2="417" stroke="#555" stroke-width="3"/>
    <circle cx="140" cy="417" r="6" fill="#0000FF"/>
    <text x="183" y="398" text-anchor="middle" fill="#0000FF" font-size="9">START</text>
    <text x="183" y="412" text-anchor="middle" fill="#fff" font-size="10">1</text>

    <rect x="244" y="380" width="110" height="50" rx="4" fill="none" stroke="#444"/>
    <line x1="254" y1="417" x2="344" y2="417" stroke="#555" stroke-width="3"/>
    <circle cx="290" cy="417" r="6" fill="#0000FF"/>
    <text x="299" y="398" text-anchor="middle" fill="#0000FF" font-size="9">END</text>
    <text x="299" y="412" text-anchor="middle" fill="#fff" font-size="10">4</text>

    <rect x="360" y="380" width="110" height="50" rx="6" fill="none" stroke="#444"/>
    <text x="415" y="410" text-anchor="middle" fill="#888">KEY OFF LOOP</text>

    <rect x="476" y="380" width="110" height="50" rx="4" fill="none" stroke="#444"/>
    <line x1="486" y1="417" x2="576" y2="417" stroke="#555" stroke-width="3"/>
    <circle cx="528" cy="417" r="6" fill="#00FF00"/>
    <text x="531" y="398" text-anchor="middle" fill="#00FF00" font-size="9">START</text>
    <text x="531" y="412" text-anchor="middle" fill="#fff" font-size="10">4</text>

    <rect x="592" y="380" width="110" height="50" rx="4" fill="none" stroke="#444"/>
    <line x1="602" y1="417" x2="692" y2="417" stroke="#555" stroke-width="3"/>
    <circle cx="692" cy="417" r="6" fill="#00FF00"/>
    <text x="647" y="398" text-anchor="middle" fill="#00FF00" font-size="9">END</text>
    <text x="647" y="412" text-anchor="middle" fill="#fff" font-size="10">8</text>

    <rect x="708" y="380" width="150" height="20" rx="3" fill="#529DEC" opacity="0.25"/>
    <text x="783" y="394" text-anchor="middle" fill="#529DEC" font-size="10" letter-spacing="1">ENV SELECT</text>

    <rect x="12" y="460" width="150" height="80" rx="4" fill="none" stroke="#444"/>
    <text x="87" y="475" text-anchor="middle" fill="#888" font-size="9">ENV STAGE</text>
    <line x1="22" y1="520" x2="152" y2="520" stroke="#555" stroke-width="3"/>
    <circle cx="22" cy="520" r="6" fill="#fff"/>
    <text x="87" y="535" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>

    <rect x="170" y="460" width="150" height="80" rx="4" fill="none" stroke="#444"/>
    <text x="245" y="475" text-anchor="middle" fill="#888" font-size="9">TIME</text>
    <line x1="180" y1="520" x2="310" y2="520" stroke="#555" stroke-width="3"/>
    <circle cx="310" cy="520" r="6" fill="#fff"/>
    <text x="245" y="535" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">127</text>

    <rect x="328" y="460" width="150" height="80" rx="4" fill="none" stroke="#444"/>
    <text x="403" y="475" text-anchor="middle" fill="#888" font-size="9">LEVEL</text>
    <line x1="338" y1="520" x2="468" y2="520" stroke="#555" stroke-width="3"/>
    <circle cx="358" cy="520" r="6" fill="#fff"/>
    <text x="403" y="535" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">20</text>

    <rect x="708" y="460" width="296" height="80" rx="6" fill="#F45C51" opacity="0.85"/>
    <text x="856" y="505" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">WAVE ENV</text>
  </g>
</svg>
