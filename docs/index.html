<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Electra One Widgets</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Electra One Widgets</h1>
  <p>A community library of custom Lua widgets for the
    <a href="https://electra.one">Electra One</a> MIDI controller.</p>
  <p><a href="https://github.com/roomi-fields/electraone-widgets">GitHub</a> ·
     <a href="https://github.com/roomi-fields/electraone-widgets/blob/main/CONTRIBUTING.md">Contribute a widget</a></p>
</header>
<main id="grid"></main>
<script>
fetch("widgets.json").then(r => r.json()).then(ws => {
  const grid = document.getElementById("grid");
  ws.forEach(w => {
    const card = document.createElement("a");
    card.className = "card";
    card.href = `https://github.com/roomi-fields/electraone-widgets/tree/main/widgets/${w.slug}`;
    card.innerHTML = `
      <img src="previews/${w.slug}.png" alt="${w.name}" onerror="this.style.display='none'">
      <h2>${w.name}</h2>
      <p>${w.description}</p>`;
    grid.appendChild(card);
  });
});
</script>
</body>
</html>
