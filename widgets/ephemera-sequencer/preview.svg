<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1016 560" width="1016" height="560" role="img" aria-label="Ephemera 16-step sequencer preview">
  <!-- Ephemera 1-track 16-step sequencer (shankar) — runtime drawn by Lua Component(…) -->

  <!-- background -->
  <rect x="0" y="0" width="1016" height="560" fill="#000000"/>

  <!-- Title labels (purple per Lua PURPLE Component color) -->
  <g font-family="'Open Sans',sans-serif" font-weight="700" font-size="16" fill="#B14AE0" text-anchor="middle">
    <rect x="37"  y="50" width="120" height="50" fill="none" stroke="#B14AE0" stroke-width="1" rx="2"/>
    <text x="97"  y="82">Ephemera</text>
    <rect x="867" y="50" width="120" height="50" fill="none" stroke="#B14AE0" stroke-width="1" rx="2"/>
    <text x="927" y="82">Sequencer</text>
  </g>

  <!-- Row frames (BLUE — outlines per Lua topRows / bottomRows) -->
  <rect x="187" y="30"  width="650" height="275" fill="none" stroke="#1F6FEB" stroke-width="1"/>
  <rect x="187" y="305" width="650" height="275" fill="none" stroke="#1F6FEB" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.35"/>

  <!-- Left control column: Top (focused, RED) / Bottom (WHITE) / Clear -->
  <g font-family="'Open Sans',sans-serif" font-weight="600" font-size="14" text-anchor="middle">
    <rect x="37" y="190" width="100" height="50" fill="#E03C3C" rx="4"/>
    <text x="87" y="220" fill="#fff">Top</text>
    <rect x="37" y="275" width="100" height="50" fill="none" stroke="#888" rx="4"/>
    <text x="87" y="305" fill="#ccc">Bottom</text>
    <rect x="37" y="360" width="100" height="50" fill="none" stroke="#888" rx="4"/>
    <text x="87" y="390" fill="#ccc">Clear</text>
  </g>

  <!-- Right control column: Play / Pause / Stop (STOP red in state "stopped") -->
  <g font-family="'Open Sans',sans-serif" font-weight="600" font-size="14" text-anchor="middle">
    <rect x="887" y="190" width="100" height="50" fill="none" stroke="#888" rx="4"/>
    <text x="937" y="220" fill="#ccc">Play</text>
    <rect x="887" y="275" width="100" height="50" fill="none" stroke="#888" rx="4"/>
    <text x="937" y="305" fill="#ccc">Pause</text>
    <rect x="887" y="360" width="100" height="50" fill="#E03C3C" rx="4"/>
    <text x="937" y="390" fill="#fff">Stop</text>
  </g>

  <!-- 16 step buttons (4×4 grid). Active = GREEN, current = ORANGE, idle = WHITE border -->
  <!-- Positions from Lua: xpad=207, ypad=50, bwidth=100, bheight=100, xgap=70, ygap=35, 4 per row -->
  <g font-family="'Open Sans',sans-serif" font-weight="700" font-size="16" text-anchor="middle" fill="#fff">
    <!-- row 1 y=50 -->
    <rect x="207" y="50"  width="100" height="100" fill="#FF8A1F" rx="4"/><text x="257" y="107" fill="#000">C 4</text>
    <rect x="377" y="50"  width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="427" y="107" fill="#aaa">-</text>
    <rect x="547" y="50"  width="100" height="100" fill="#2BB673" rx="4"/><text x="597" y="107">E 4</text>
    <rect x="717" y="50"  width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="767" y="107" fill="#aaa">-</text>
    <!-- row 2 y=185 -->
    <rect x="207" y="185" width="100" height="100" fill="#2BB673" rx="4"/><text x="257" y="242">G 4</text>
    <rect x="377" y="185" width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="427" y="242" fill="#aaa">-</text>
    <rect x="547" y="185" width="100" height="100" fill="#2BB673" rx="4"/><text x="597" y="242">A 4</text>
    <rect x="717" y="185" width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="767" y="242" fill="#aaa">-</text>
    <!-- row 3 y=320 -->
    <rect x="207" y="320" width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="257" y="377" fill="#aaa">-</text>
    <rect x="377" y="320" width="100" height="100" fill="#2BB673" rx="4"/><text x="427" y="377">C 5</text>
    <rect x="547" y="320" width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="597" y="377" fill="#aaa">-</text>
    <rect x="717" y="320" width="100" height="100" fill="#2BB673" rx="4"/><text x="767" y="377">E 5</text>
    <!-- row 4 y=455 -->
    <rect x="207" y="455" width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="257" y="512" fill="#aaa">-</text>
    <rect x="377" y="455" width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="427" y="512" fill="#aaa">-</text>
    <rect x="547" y="455" width="100" height="100" fill="#2BB673" rx="4"/><text x="597" y="512">G 5</text>
    <rect x="717" y="455" width="100" height="100" fill="none" stroke="#ccc" rx="4"/><text x="767" y="512" fill="#aaa">-</text>
  </g>

  <!-- Channel / BPM labels -->
  <g font-family="'Open Sans',sans-serif" font-weight="700" font-size="14" fill="#B14AE0" text-anchor="middle">
    <rect x="37"  y="500" width="120" height="50" fill="none" stroke="#B14AE0" rx="2"/>
    <text x="97"  y="532">Channel 1</text>
    <rect x="867" y="500" width="120" height="50" fill="none" stroke="#B14AE0" rx="2"/>
    <text x="927" y="532">BPM 120</text>
  </g>
</svg>
